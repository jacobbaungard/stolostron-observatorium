kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: user4-basic-user
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: user4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: basic-user
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: user4-acm-admin
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: user4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:cluster-manager-admin
---
## access to everything
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user4-mcoa-kube-role
  namespace: open-cluster-management-observability
rules:
  - verbs:
      - get
    apiGroups:
      - observability.open-cluster-management.io
    resources:
      - observabilityaddonroles
    resourceNames:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user4-mcoa-kube-rb
  namespace: open-cluster-management-observability
subjects:
- kind: User
  name: user4
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: user4-mcoa-kube-role
  apiGroup: rbac.authorization.k8s.io
