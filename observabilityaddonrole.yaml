apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: observabilityaddonroles.observability.open-cluster-management.io
spec:
  group: observability.open-cluster-management.io
  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                actions:
                  type: array
                  items:
                    type: string
                    enum:
                      - metrics:read
                      - logs:read
                      - traces:read
                scopes:
                  type: array
                  items:
                    type: string
  scope: Namespaced
  names:
    plural: observabilityaddonroles
    singular: observabilityaddonrole
    kind: ObservabilityAddonRole
  shortNames:
    - mcoarole
